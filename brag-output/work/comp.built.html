  .shot { position: absolute; transform-origin: 0 0; }
  .shot img { display: block; width: 100%; height: 100%; }

      set($("pop"), { left: `${L}px`, top: `${T}px`, width: `${Wd}px`, height: `${Ht}px`, opacity: p, transform: `scale(${lerp(0.95, 1, p)})`, transformOrigin: `${META.gold.x + 20 - L}px ${Ht}px`, visibility: p > 0 ? "visible" : "hidden" });
      set($("pop").querySelector("img"), { left: `${-L}px`, top: `${-T}px` });
    }
  }

  // cursor + ripples
  {
    const c = cursorAt(t);
    if (c && c.vis > 0) set($("cursor"), { visibility: "visible", opacity: c.vis, transform: `translate(${c.x - 6}px, ${c.y - 4}px) scale(${1 - 0.14 * clamp(c.press)})` });
    else $("cursor").style.visibility = "hidden";
    ripples.forEach((r, i) => {
      const t0 = clicks[i], p = seg(t, t0, t0 + 0.45);
      if (p <= 0 || p >= 1) { r.style.visibility = "hidden"; return; }
      const cc = cursorAt(t0 + 0.001);
      const rad = lerp(6, 46, eOut(p));
      set(r, { visibility: "visible", left: `${cc.x - rad}px`, top: `${cc.y - rad}px`, width: `${rad * 2}px`, height: `${rad * 2}px`, opacity: 1 - p });
    });
  }

  // S7 outro
  {
    renderCap(caps.o1, t); renderCap(caps.o2, t);
    const lp = eOut(seg(t, 20.15, 20.6));
    set($("oLock"), { opacity: lp, transform: `translateY(${(1 - lp) * 22}px)` });
    const on = t > 19.05;
    loopSvg.style.visibility = on ? "visible" : "hidden";
    arcs.forEach((a, i) => {
      const p = eIO(seg(t, 19.2 + i * 0.2, 19.62 + i * 0.2));
      a.base.setAttribute("stroke-dasharray", `${a.len}`);
      a.base.setAttribute("stroke-dashoffset", `${a.len * (1 - p)}`);
      a.head.style.opacity = seg(t, 19.55 + i * 0.2, 19.65 + i * 0.2);
    });
    loopNodes.forEach((n, i) => {
      const p = seg(t, 19.14 + i * 0.16, 19.5 + i * 0.16);
      const ang = (loopSpec[i].ang * Math.PI) / 180;
      const x = LC.x + LC.r * Math.cos(ang), y = LC.y + LC.r * Math.sin(ang);
      // comet proximity highlight
      const ca = cometAngle(t);
      let d = Math.abs(((ca - loopSpec[i].ang) % 360 + 540) % 360 - 180);
      const hot = t > 20.05 ? clamp(1 - d / 28) : 0;
      set(n, { left: `${x - n.offsetWidth / 2}px`, top: `${y - 35}px`, opacity: clamp(p * 1.8), transform: `scale(${lerp(0.6, 1, eBack(p)) * (1 + 0.05 * hot)})`, visibility: on ? "visible" : "hidden" });
      const ic = n.querySelector(".ic");
      ic.style.background = hot > 0 ? `rgba(242,102,42,${0.18 + 0.82 * hot})` : "#E4EDEC";
      ic.style.color = hot > 0.4 ? "#fff" : "#29524F";
    });
    arcLbl.forEach((l, i) => {
      const ang = ((loopSpec[i].ang + 45) * Math.PI) / 180;
      const rr = LC.r + 58;
      const p = eOut(seg(t, 19.7 + i * 0.12, 20.1 + i * 0.12));
      set(l, { left: `${LC.x + rr * Math.cos(ang) - l.offsetWidth / 2}px`, top: `${LC.y + rr * Math.sin(ang) - 12}px`, opacity: p, visibility: on ? "visible" : "hidden" });
    });
    const cp = seg(t, 20.0, 20.25);
    const ca = (cometAngle(t) * Math.PI) / 180;
    const cx = LC.x + LC.r * Math.cos(ca), cy = LC.y + LC.r * Math.sin(ca);
    [comet, cometGlow].forEach((c) => { c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.style.opacity = cp; });
  }
}
function cometAngle(t) { return -90 + Math.max(0, t - 20.0) * 180; }

window.renderAt = renderAt;
window.ready = (async () => {
  await document.fonts.load("800 80px Inter"); await document.fonts.load("700 50px Inter"); await document.fonts.load("600 20px 'IBM Plex Mono'"); await document.fonts.load("500 30px Inter");
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode()));
  renderAt(0);
  return true;
})();
</script>
