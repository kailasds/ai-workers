<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#fff"/><rect width="210" height="800" fill="#0F2A2E"/><text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#C9D2D0" text-anchor="start">AI Worker Platform</text><text x="30" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#8FA19E" text-anchor="start">Dashboard</text><text x="30" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#8FA19E" text-anchor="start">Compose</text><text x="30" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#8FA19E" text-anchor="start">Registry</text><text x="30" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#8FA19E" text-anchor="start">Knowledge</text><text x="30" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#8FA19E" text-anchor="start">Learning</text><rect x="10" y="280" width="190" height="36" rx="8" fill="#ffffff22"/><rect x="10" y="288" width="3" height="20" fill="#F2662A"/><text x="30" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#fff" text-anchor="start">Sentinel</text><text x="250" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1A2422" text-anchor="start">Sentinel</text><text x="250" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">Keeps Workers, knowledge, and evolution within their boundaries.</text><rect x="250" y="100" width="920" height="64" rx="12" fill="#F4F5F6" stroke="#B8BEC4"/><text x="264" y="136.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1A2422" text-anchor="start">Platform Sentinel decides on its own what to share and which Workers may evolve. Every decision is recorded and can be overridden.</text><rect x="250" y="180" width="482" height="40" rx="20" fill="#F4F5F6" stroke="#F4F5F6"/><rect x="256" y="185" width="142" height="30" rx="15" fill="#F2662A" stroke="#F2662A"/><text x="327.0" y="204.33333333333334" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Worker reviews</text><text x="489.0" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">Platform decisions</text><text x="659.0" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6B7280" text-anchor="middle">Knowledge health</text><rect x="250" y="240" width="900" height="240" rx="12" fill="#fff" stroke="#B8BEC4"/><text x="266" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A2422" text-anchor="start">Retry back-off defaults</text><text x="266" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="start">Knowledge review - Worker Sentinel   [Needs review]</text><rect x="268" y="290" width="500" height="5" rx="2" fill="#DADDE0"/><rect x="268" y="308" width="470" height="5" rx="2" fill="#DADDE0"/><rect x="268" y="326" width="440" height="5" rx="2" fill="#DADDE0"/><rect x="268" y="344" width="500" height="5" rx="2" fill="#DADDE0"/><text x="268" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#F2662A" text-anchor="start">Evidence &gt; (expand)</text><rect x="268" y="420" width="100" height="34" rx="10" fill="#F2662A" stroke="#F2662A"/><text x="318.0" y="441.3333333333333" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Approve</text><rect x="378" y="420" width="80" height="34" rx="10" fill="#fff" stroke="#B8BEC4"/><text x="418.0" y="441.3333333333333" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A2422" text-anchor="middle">Hold</text><rect x="468" y="420" width="90" height="34" rx="10" fill="#fff" stroke="#B8BEC4"/><text x="513.0" y="441.3333333333333" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A2422" text-anchor="middle">Reject</text><text x="250" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="start">When empty: &quot;Everything is up to date&quot;</text></svg>