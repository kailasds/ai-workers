<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0C2426; }
  body { font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; }
  #root { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(165deg, #0F2A2E, #0C2426); }
  #texture { position: absolute; inset: 0; background-image: repeating-radial-gradient(circle at 85% 12%, rgba(255,255,255,0.035) 0 1px, transparent 1px 13px); }
  .glow { position: absolute; border-radius: 50%; }
  .abs { position: absolute; }
  .cap { position: absolute; font-weight: 800; letter-spacing: -0.025em; line-height: 1.08; white-space: nowrap; }
  .cap .w { display: inline-block; }
  .accent { color: #F2662A; }
  .eyebrow { position: absolute; display: flex; align-items: center; gap: 12px; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 19px; letter-spacing: 0.22em; color: #F2662A; white-space: nowrap; }
  .eyebrow .ic { width: 34px; height: 34px; border-radius: 10px; background: rgba(242,102,42,0.14); display: grid; place-items: center; }
  .eyebrow .ic svg { width: 19px; height: 19px; }
  .shot { position: absolute; overflow: hidden; }
  .shot img { display: block; width: 100%; height: 100%; }
  #stage { position: absolute; left: 120px; top: 222px; width: 1680px; height: 780px; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 40px 100px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06); }
  .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .cam > img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .ring { position: absolute; border: 3px solid #F2662A; border-radius: 12px; }
  #strip { position: absolute; left: 0; right: 0; top: 0; height: 46px; background: #F7F8F8; border-bottom: 1px solid #E5E7EA; display: flex; align-items: center; gap: 10px; padding: 0 26px; }
  #strip span.l { position: relative; font-size: 15px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9CA3AF; }
  #strip span.l u { position: absolute; left: 0; bottom: -7px; height: 3px; border-radius: 2px; background: #F2662A; display: block; }
  #strip svg { width: 16px; height: 16px; color: #9CA3AF; }
  #cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; transform-origin: 6px 4px; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35)); }
  .ripple { position: absolute; border-radius: 50%; border: 3px solid #F2662A; }
  .logo { display: inline-grid; place-items: center; border-radius: 14px; background: rgba(255,255,255,0.15); font-weight: 800; color: #C9D2D0; }
  .node { position: absolute; display: flex; align-items: center; gap: 12px; height: 70px; padding: 0 26px 0 18px; border-radius: 35px; background: #fff; color: #0F2A2E; font-size: 25px; font-weight: 700; box-shadow: 0 18px 40px rgba(0,0,0,0.35); white-space: nowrap; }
  .node .ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #E4EDEC; color: #29524F; }
  .node .ic svg { width: 24px; height: 24px; }
  .arclabel { position: absolute; font-size: 18px; font-weight: 600; color: #8FA19E; white-space: nowrap; }
  #rail { position: absolute; left: 0; right: 0; top: 1026px; display: flex; justify-content: center; gap: 30px; font-family: "IBM Plex Mono", monospace; font-size: 15px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }

  #rail span u { position: absolute; left: 0; right: 0; bottom: -8px; height: 2px; background: #F2662A; display: block; transform-origin: 0 50%; }

</style>

  head.setAttribute("fill", "none"); head.setAttribute("stroke", "rgba(255,255,255,0.55)"); head.setAttribute("stroke-width", "3"); head.setAttribute("stroke-linecap", "round"); head.setAttribute("stroke-linejoin", "round");

const cometGlow = document.createElementNS(svgNS, "circle"); cometGlow.setAttribute("r", "24"); cometGlow.setAttribute("fill", "rgba(242,102,42,0.25)");
const comet = document.createElementNS(svgNS, "circle"); comet.setAttribute("r", "9"); comet.setAttribute("fill", "#F2662A");
loopSvg.appendChild(cometGlow); loopSvg.appendChild(comet);
const cometAngle = (t) => -90 + Math.max(0, t - 56.0) * 180;

// ---------------- cursor ----------------
function cursorAt(t) {
  for (const o of shots) {
    if (!o.cursor) continue;
    const k = o.cursor;
    if (t < k[0][0] || t > k[k.length - 1][0]) continue;
    let i = 0; while (i < k.length - 2 && t > k[i + 1][0]) i++;
    const p = eIO(seg(t, k[i][0], k[i + 1][0]));
    const c = camOf(o, t);
    const pt = toVideo(c, lerp(k[i][1], k[i + 1][1], p), lerp(k[i][2], k[i + 1][2], p));
    const vis = seg(t, k[0][0], k[0][0] + 0.15) * (1 - seg(t, k[k.length - 1][0] - 0.2, k[k.length - 1][0]));
    const press = Math.max(0, ...(o.clicks || []).map((ct) => seg(t, ct - 0.06, ct - 0.01) - seg(t, ct + 0.01, ct + 0.08)));
    return { ...pt, vis, press };

}
const clickList = shots.flatMap((o) => (o.clicks || []));
$("ripples").innerHTML = clickList.map(() => `<div class="ripple"></div>`).join("");
const ripples = [...document.querySelectorAll(".ripple")];

// ---------------- render ----------------
function renderAt(t) {
  set($("glowA"), { left: `${-260 + 60 * Math.sin(t * 0.25)}px`, top: `${640 + 40 * Math.cos(t * 0.2)}px`, width: "900px", height: "900px", background: "radial-gradient(circle, rgba(242,102,42,0.16), transparent 62%)" });
  set($("glowB"), { left: `${1180 + 50 * Math.cos(t * 0.22)}px`, top: `${-420 + 40 * Math.sin(t * 0.3)}px`, width: "1100px", height: "1100px", background: "radial-gradient(circle, rgba(127,163,159,0.14), transparent 62%)" });

  caps.forEach((c) => renderCap(c, t));

  // hook sidebar
  {
    const pin = eOut(seg(t, 0.05, 0.65)), pout = eIn(seg(t, 4.72, 5.05));
    set($("side"), { left: `${1540 + (1 - pin) * 120 + pout * 140}px`, top: "90px", width: "280px", height: "900px", opacity: pin * (1 - pout), visibility: t < 5.1 ? "visible" : "hidden" });
    navEls.forEach((n) => { const p = eOut(seg(t, n.t, n.t + 0.3)); set(n.el, { opacity: p, transform: `scaleX(${lerp(0.9, 1, p)})`, transformOrigin: "0 50%" }); });
  }
  // reveal
  {
    const pin = eOut(seg(t, 5.0, 5.85)), pout = eIn(seg(t, 8.12, 8.36));
    const s = 0.95;
    set($("shell"), { width: `${1600 * s}px`, height: `${900 * s}px`, left: `${(1920 - 1600 * s) / 2}px`, top: `${lerp(1180, 372, pin) - 26 * seg(t, 5.85, 8.12) + pout * 90}px`, opacity: 1 - pout, transform: `perspective(1600px) rotateX(${(1 - pin) * 16}deg) scale(${1 - 0.03 * pout})`, transformOrigin: "50% 0%", visibility: t > 4.95 && t < 8.4 ? "visible" : "hidden" });
    const lk = (a) => eOut(seg(t, a, a + 0.45)), lout = eIn(seg(t, 8.02, 8.24));
    [["lkEye", 5.12], ["lkMark", 5.22], ["lkTag", 5.45]].forEach(([id, a]) => set($(id), { opacity: lk(a) * (1 - lout), transform: `translateY(${(1 - lk(a)) * 26 - lout * 20}px)` }));
    $("lockup").style.visibility = t > 5.0 && t < 8.3 ? "visible" : "hidden";
  }
  // stage + chapters
  {
    const pin = eOut(seg(t, 8.4, 8.8)), pout = eIn(seg(t, 54.82, 55.1));
    set($("stage"), { opacity: pin * (1 - pout), transform: `translateY(${(1 - pin) * 46 + pout * 36}px) scale(${lerp(0.975, 1, pin)})`, visibility: t > 8.35 && t < 55.12 ? "visible" : "hidden" });
    set($("rail"), { opacity: seg(t, 8.6, 9.0) * (1 - seg(t, 54.8, 55.05)) });
    chapters.forEach((c) => {
      const a = c.caps[0][1], b = c.caps[c.caps.length - 1][2];
      set(c.eye, { opacity: eOut(seg(t, a - 0.05, a + 0.3)) * (1 - seg(t, b, b + 0.18)), transform: `translateY(${(1 - eOut(seg(t, a - 0.05, a + 0.3))) * 14}px)` });
      const act = t >= c.t0 && t < c.t1;
      c.railEl.style.color = act ? "#F2662A" : t >= c.t1 ? "rgba(201,210,208,0.75)" : "rgba(201,210,208,0.4)";
      set(c.railEl.querySelector("u"), { transform: `scaleX(${act ? eOut(seg(t, c.t0, c.t0 + 0.4)) : 0})` });
    });
    shots.forEach((o) => {
      const vis = seg(t, o.t0, o.t0 + o.fin) * (1 - seg(t, o.t1 - o.fout, o.t1));
      if (vis <= 0) { o.el.style.display = "none"; return; }
      const c = camOf(o, t);
      set(o.el, { display: "block", opacity: vis, transform: `translate(${STAGE.w / 2 - c.cx * c.s}px, ${STAGE.h / 2 - c.cy * c.s}px) scale(${c.s})` });
      if (o.after) o.after.el.style.opacity = t >= o.after.t ? 1 : 0;
      if (o.draw) o.draw(o, t, c);
    });
    const gShot = shots.find((o) => o.img === "graph");
    const gv = seg(t, gShot.t0, gShot.t0 + gShot.fin) * (1 - seg(t, gShot.t1 - gShot.fout, gShot.t1));
    set($("strip"), { opacity: gv, visibility: gv > 0 ? "visible" : "hidden" });
    stripLabels.forEach((l, i) => {
      const p = i < 4 ? eOut(seg(t, traceT[i], traceT[i] + 0.3)) : 0;
      l.style.color = p > 0 ? `rgb(${lerp(156, 242, p)},${lerp(163, 102, p)},${lerp(175, 42, p)})` : "#9CA3AF";
      l.querySelector("u").style.width = `${p * 100}%`;
    });
  }
  // cursor
  {
    const c = cursorAt(t);
    if (c && c.vis > 0) set($("cursor"), { visibility: "visible", opacity: c.vis, transform: `translate(${c.x - 6}px, ${c.y - 4}px) scale(${1 - 0.14 * clamp(c.press)})` });
    else $("cursor").style.visibility = "hidden";
    ripples.forEach((r, i) => {
      const t0 = clickList[i], p = seg(t, t0, t0 + 0.45);
      if (p <= 0 || p >= 1) { r.style.visibility = "hidden"; return; }
      const cc = cursorAt(t0);
      if (!cc) { r.style.visibility = "hidden"; return; }
      const rad = lerp(6, 46, eOut(p));
      set(r, { visibility: "visible", left: `${cc.x - rad}px`, top: `${cc.y - rad}px`, width: `${rad * 2}px`, height: `${rad * 2}px`, opacity: 1 - p });
    });
  }
  // outro
  {
    const lp = eOut(seg(t, 56.15, 56.6));
    set($("oLock"), { opacity: lp, transform: `translateY(${(1 - lp) * 22}px)` });
    const on = t > 55.05;
    loopSvg.style.visibility = on ? "visible" : "hidden";
    arcs.forEach((a, i) => {
      const p = eIO(seg(t, 55.2 + i * 0.2, 55.62 + i * 0.2));
      a.base.setAttribute("stroke-dasharray", `${a.len}`); a.base.setAttribute("stroke-dashoffset", `${a.len * (1 - p)}`);

    const ca = cometAngle(t);
    loopNodes.forEach((n, i) => {
      const p = seg(t, 55.14 + i * 0.16, 55.5 + i * 0.16);
      const ang = (loopSpec[i].ang * Math.PI) / 180;
      const d = Math.abs(((ca - loopSpec[i].ang) % 360 + 540) % 360 - 180);
      const hot = t > 56.05 ? clamp(1 - d / 28) : 0;
      set(n, { left: `${LC.x + LC.r * Math.cos(ang) - n.offsetWidth / 2}px`, top: `${LC.y + LC.r * Math.sin(ang) - 35}px`, opacity: clamp(p * 1.8), transform: `scale(${lerp(0.6, 1, eBack(p)) * (1 + 0.05 * hot)})`, visibility: on ? "visible" : "hidden" });
      const ic = n.querySelector(".ic");
      ic.style.background = hot > 0 ? `rgba(242,102,42,${0.18 + 0.82 * hot})` : "#E4EDEC";
      ic.style.color = hot > 0.4 ? "#fff" : "#29524F";
    });
    arcLbl.forEach((l, i) => {
      const ang = ((loopSpec[i].ang + 45) * Math.PI) / 180, rr = LC.r + 58, p = eOut(seg(t, 55.7 + i * 0.12, 56.1 + i * 0.12));
      set(l, { left: `${LC.x + rr * Math.cos(ang) - l.offsetWidth / 2}px`, top: `${LC.y + rr * Math.sin(ang) - 12}px`, opacity: p, visibility: on ? "visible" : "hidden" });
    });
    const cp = seg(t, 56.0, 56.25), cr = (ca * Math.PI) / 180;
    [comet, cometGlow].forEach((c) => { c.setAttribute("cx", LC.x + LC.r * Math.cos(cr)); c.setAttribute("cy", LC.y + LC.r * Math.sin(cr)); c.style.opacity = cp; });
  }
}

window.renderAt = renderAt;
window.ready = (async () => {
  for (const f of ["800 80px Inter", "750 50px Inter", "700 30px Inter", "500 30px Inter", "600 20px 'IBM Plex Mono'"]) await document.fonts.load(f);
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode()));
  renderAt(0);
  return true;
})();
</script>
